<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý Tạm trú</title>
<meta name="description" content="Hệ thống quản lý tạm trú tại cơ sở lưu trú">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --font-sans: "Be Vietnam Pro", ui-sans-serif, system-ui, sans-serif;
    --color-canvas: #F6F7FB;
    --color-ink: #2B2D42;
    --color-muted: #6B7089;
    --color-line: #E9EAF2;
    --color-brand: #6C7BF2;
    --color-brand-600: #5463E6;
    --color-brand-50: #EEF0FE;
    --color-mint: #DDF4EA;     --color-mint-ink: #1F6B4A;
    --color-butter: #FFF1C9;   --color-butter-ink: #8A5A00;
    --color-rose: #FDE0E0;     --color-rose-ink: #A12B2B;
    --color-sky: #E0F0FF;      --color-sky-ink: #1F5A99;
    --color-lilac: #EFEAF8;    --color-lilac-ink: #5B3FA0;
    --color-peach: #FDE8D7;    --color-peach-ink: #9A4A14;
    --color-fog: #ECEEF2;      --color-fog-ink: #555B66;
    --shadow-soft: 0 1px 2px rgb(43 45 66 / .04), 0 4px 16px rgb(43 45 66 / .06);
  }
  @utility card { @apply bg-white rounded-2xl border border-line shadow-soft; }
    @utility btn-primary { @apply inline-flex items-center justify-center gap-1.5 h-10 px-4 rounded-xl text-sm font-medium transition active:scale-[.98] disabled:opacity-50 disabled:pointer-events-none cursor-pointer bg-brand text-white hover:bg-brand-600; }
  @utility btn-soft { @apply inline-flex items-center justify-center gap-1.5 h-10 px-4 rounded-xl text-sm font-medium transition active:scale-[.98] disabled:opacity-50 disabled:pointer-events-none cursor-pointer bg-brand-50 text-brand-600 hover:bg-[#E2E5FD]; }
  @utility btn-ghost { @apply inline-flex items-center justify-center gap-1.5 h-10 px-4 rounded-xl text-sm font-medium transition active:scale-[.98] disabled:opacity-50 disabled:pointer-events-none cursor-pointer text-muted hover:bg-canvas hover:text-ink; }
  @utility btn-danger { @apply inline-flex items-center justify-center gap-1.5 h-10 px-4 rounded-xl text-sm font-medium transition active:scale-[.98] disabled:opacity-50 disabled:pointer-events-none cursor-pointer bg-rose text-rose-ink hover:bg-[#FBD0D0]; }
  @utility btn-sm { @apply h-8 px-3 text-[13px] rounded-lg; }
  @utility inp { @apply w-full h-10 px-3 rounded-xl border border-line bg-white text-sm text-ink placeholder:text-muted/70 outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/15; }
  @utility lbl { @apply block text-[13px] font-medium text-muted mb-1.5; }
  @utility chip { @apply inline-flex items-center gap-1.5 h-8 px-3 rounded-full text-[13px] font-medium border border-line bg-white text-muted transition cursor-pointer hover:text-ink; &[aria-pressed="true"] { @apply bg-ink text-white border-ink; } }
  @utility badge { @apply inline-flex items-center gap-1 h-6 px-2.5 rounded-full text-xs font-medium whitespace-nowrap; }
  @utility nav-a { @apply flex items-center gap-3 h-11 px-3 rounded-xl text-sm font-medium text-muted transition hover:bg-canvas hover:text-ink; &[aria-current="page"] { @apply bg-brand-50 text-brand-600; } }
  @utility th { @apply text-left text-xs font-semibold text-muted uppercase tracking-wide px-4 py-3 bg-canvas/70; }
  @utility td { @apply px-4 py-3 text-sm border-t border-line align-middle; }
</style>
<style>
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-feature-settings: "tnum" 1; }
  .scroll-thin::-webkit-scrollbar { height: 6px; width: 6px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: #DADCE8; border-radius: 99px; }
  .drawer { transition: transform .25s ease; }
  .fade { animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .skel { background: linear-gradient(90deg, #EEF0F6 25%, #F6F7FB 37%, #EEF0F6 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; border-radius: 12px; }
  @keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body class="bg-canvas text-ink font-sans antialiased min-h-screen">

<div id="previewBanner" hidden class="bg-butter text-butter-ink text-[13px] px-4 py-2 text-center"></div>

<div class="lg:flex min-h-screen">
  <!-- Thanh bên (máy tính) -->
  <aside class="hidden lg:flex lg:flex-col w-64 shrink-0 border-r border-line bg-white/70 backdrop-blur px-4 py-6 sticky top-0 h-screen">
    <a href="#/tong-quan" class="flex items-center gap-3 px-2 mb-8">
      <span class="grid place-items-center size-10 rounded-2xl bg-gradient-to-br from-[#C9D0FF] to-[#FAD6E6] text-brand-600">
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      </span>
      <span class="leading-tight"><b class="block text-[15px]">Quản lý Tạm trú</b><span class="text-xs text-muted">Cơ sở lưu trú</span></span>
    </a>
    <nav id="navSide" class="flex flex-col gap-1"></nav>
    <div class="mt-auto pt-6">
      <a href="huongdan.html" target="_blank" class="nav-a mb-2"><svg viewBox="0 0 24 24" class="size-[18px]" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.1M12 17h.01"/></svg>Hướng dẫn</a>
      <div id="userBox" class="flex items-center gap-3 p-3 rounded-2xl bg-canvas"></div>
    </div>
  </aside>

  <div class="flex-1 min-w-0">
    <!-- Thanh trên (điện thoại) -->
    <header class="lg:hidden sticky top-0 z-30 bg-white/85 backdrop-blur border-b border-line px-4 h-14 flex items-center gap-3">
      <span class="grid place-items-center size-8 rounded-xl bg-gradient-to-br from-[#C9D0FF] to-[#FAD6E6] text-brand-600">
        <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      </span>
      <b id="mTitle" class="text-[15px]">Quản lý Tạm trú</b>
      <span id="userMini" class="ml-auto"></span>
    </header>

    <main id="view" class="px-4 sm:px-6 lg:px-10 py-5 lg:py-8 pb-28 lg:pb-10 max-w-[1280px] mx-auto"></main>
  </div>
</div>

<!-- Thanh dưới (điện thoại) -->
<nav id="navBottom" class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur border-t border-line grid pb-[env(safe-area-inset-bottom)]"></nav>

<!-- Ngăn kéo (form / chi tiết) -->
<div id="drawerWrap" hidden class="fixed inset-0 z-40">
  <div data-close class="absolute inset-0 bg-ink/25 backdrop-blur-[2px]"></div>
  <section id="drawer" class="drawer absolute right-0 top-0 h-full w-full sm:w-[520px] bg-white shadow-2xl flex flex-col translate-x-full"></section>
</div>

<!-- Hộp xác nhận -->
<div id="dlgWrap" hidden class="fixed inset-0 z-50 grid place-items-center p-4">
  <div class="absolute inset-0 bg-ink/30"></div>
  <div class="relative card w-full max-w-sm p-5 fade" role="alertdialog" aria-modal="true">
    <h3 id="dlgTitle" class="font-semibold text-base"></h3>
    <p id="dlgText" class="text-sm text-muted mt-1.5"></p>
    <div id="dlgExtra" class="mt-3"></div>
    <div class="flex justify-end gap-2 mt-5">
      <button id="dlgNo" class="btn-ghost">Huỷ</button>
      <button id="dlgYes" class="btn-primary">Đồng ý</button>
    </div>
  </div>
</div>

<!-- Màn đăng nhập -->
<div id="loginWrap" hidden class="fixed inset-0 z-[55] grid place-items-center p-4 bg-gradient-to-br from-[#EEF0FE] via-[#F6F7FB] to-[#FDE8F0]">
  <div class="card w-full max-w-sm p-7 text-center fade">
    <span class="mx-auto grid place-items-center size-14 rounded-2xl bg-gradient-to-br from-[#C9D0FF] to-[#FAD6E6] text-brand-600 mb-4">
      <svg viewBox="0 0 24 24" class="size-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    </span>
    <h1 class="text-xl font-semibold">Quản lý Tạm trú</h1>
    <p class="text-sm text-muted mt-1 mb-6">Đăng nhập bằng tài khoản Google đã được cấp quyền</p>
    <div id="loginMsg" class="mb-4"></div>
    <div id="gBtn" class="flex justify-center min-h-11"></div>
    <p id="loginPing" class="text-xs text-muted mt-6"></p>
    <p class="text-xs text-muted mt-2"><a href="huongdan.html" class="underline hover:text-brand-600">Hướng dẫn sử dụng</a> · <a href="privacy.html" class="underline hover:text-brand-600">Chính sách quyền riêng tư</a></p>
  </div>
</div>

<div id="toasts" class="fixed z-[60] bottom-20 lg:bottom-6 right-4 left-4 sm:left-auto flex flex-col gap-2 items-end pointer-events-none"></div>

<script src="js/config.js?v=1.7.0"></script>
<script src="js/api.js?v=1.7.0"></script>
<script src="js/app.js?v=1.7.0"></script>
</body>
</html>
