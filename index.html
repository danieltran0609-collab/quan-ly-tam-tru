<style>
  [hidden] { display: none !important; }

  .drawer { transition: transform .25s ease; }
  .fade { animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .skel { background: linear-gradient(90deg, #EEF0F6 25%, #F6F7FB 37%, #EEF0F6 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; border-radius: 12px; }
  @keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  /* Nút tròn nổi (FAB) trên điện thoại */
  .fab { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 9999px; background: #6C7BF2; color: #fff; font-size: 0; box-shadow: 0 8px 22px rgb(84 99 230 / .38); transition: transform .15s; }
  .fab svg { width: 26px; height: 26px; flex: none; }
  .fab > span { display: none; }
  .fab:active { transform: scale(.94); }
  body.dang-chon .fab-wrap { display: none; }
  /* Bảng trượt từ dưới lên */
  .bang-truot { animation: truot .22s ease-out; }
  /* Nhập theo danh sách: ngăn kéo rộng + bảng nhiều cột trên máy tính, thẻ gọn trên điện thoại */
  @media (min-width: 640px) {

  }
  @keyframes truot { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  #dauMobi.an-di { transform: translateY(-100%); }
  /* Vùng chạm tối thiểu 44×44px trên điện thoại */
  /* Nhãn lọc nhỏ: cao 32px, vùng chạm mở rộng lên 44px bằng lớp trong suốt */
  .chip-nho { position: relative; height: 32px; padding-left: 12px; padding-right: 12px; font-size: 12.5px; }

  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
